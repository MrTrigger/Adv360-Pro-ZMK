on:
  push:
    branches: [V3.0]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '17 1 * * 1'

name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      full: ${{ steps.scope.outputs.full }}
      firmware: ${{ steps.scope.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check shared toolchain versions
        run: python3 "$GITHUB_WORKSPACE/.github/ci/check-toolchains.py" --root "$GITHUB_WORKSPACE"
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/ci-scope.sh "$EVENT" "$ACTION" "$BASE" "$HEAD" "$DRAFT" >> "$GITHUB_OUTPUT"
      - name: Check native callers and version metadata
        if: steps.scope.outputs.app == 'true'
        run: |
          python3 -B -m unittest discover -s scripts/tests
          python3 scripts/bazel/zephyr/tools/native_tools_test.py

  build:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.firmware == 'false') }}
    runs-on: ubuntu-latest
    name: Build (Legacy)
    env:
      CI: '1'
      ADV_BAZEL_CACHE: read
      PERSONAL_BAZEL_CACHE_CREDENTIAL: ${{ secrets.PERSONAL_BAZEL_CACHE_READER_CREDENTIAL }}
    steps:
      - name: Require successful validation plan
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          RUN_SUITE: ${{ needs.changes.outputs.firmware }}
        run: test "$PLAN_RESULT" = success && test "$RUN_SUITE" = true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build native firmware
        shell: bash
        run: |
          commit=${GITHUB_SHA:0:7}
          branch=${GITHUB_REF_NAME:0:4}
          scripts/build-firmware --flavor legacy --commit "$commit" --branch "$branch"
      - name: Archive (Adv360)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-no-clique
          path: firmware/*.uf2
          if-no-files-found: error

  build-clique:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.firmware == 'false') }}
    runs-on: ubuntu-latest
    name: Build (Clique)
    env:
      CI: '1'
      ADV_BAZEL_CACHE: read
      PERSONAL_BAZEL_CACHE_CREDENTIAL: ${{ secrets.PERSONAL_BAZEL_CACHE_READER_CREDENTIAL }}
    steps:
      - name: Require successful validation plan
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          RUN_SUITE: ${{ needs.changes.outputs.firmware }}
        run: test "$PLAN_RESULT" = success && test "$RUN_SUITE" = true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build native firmware
        shell: bash
        run: |
          commit=${GITHUB_SHA:0:7}
          branch=${GITHUB_REF_NAME:0:4}
          scripts/build-firmware --flavor studio --commit "$commit" --branch "$branch"
      - name: Archive (Adv360)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-clique
          path: firmware/*.uf2
          if-no-files-found: error
